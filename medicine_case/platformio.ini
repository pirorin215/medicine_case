; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_ble_sense]
platform = nordicnrf52
board = seeed_xiao_ble_sense
framework = arduino

; Serial options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build options
build_flags =
    -DARDUINO_NRF52840_SEEED_XIAO_BLE_SENSE
    -DBOARD_NAME="Seeed_XIAO_BLE_Sense"

; Upload options
upload_protocol = jlink
; upload_protocol = nrfutil

; Debug options
debug_tool = jlink
debug_init_break = tbreak setup

; Libraries
lib_deps =
    adafruit/Adafruit LSM6DS3TRC@^1.2.1
    adafruit/Adafruit AHRS@^2.0.0
    adafruit/Adafruit Bluefruit nRF52@^1.6.1

; Extra scripts
; extra_scripts = pre:rename.py
